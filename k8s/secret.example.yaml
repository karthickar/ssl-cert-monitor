# Do not commit a real secret. Create it with the command in README instead.
apiVersion: v1
kind: Secret
metadata:
  name: ssl-monitor-secrets
type: Opaque
stringData:
  SMTP_HOST: smtp.example.com
  SMTP_PORT: "587"
  SMTP_USERNAME: alerts@example.com
  SMTP_PASSWORD: replace-with-an-app-password
  SMTP_FROM_EMAIL: alerts@example.com
  # Enable MySQL by setting DATABASE_ENGINE=mysql in the ConfigMap and providing these values.
  MYSQL_HOST: mysql.example.internal
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: ssl_monitor
  MYSQL_USERNAME: ssl_monitor
  MYSQL_PASSWORD: replace-with-a-strong-password
  SESSION_SECRET_KEY: replace-with-a-long-random-string
  GOOGLE_CLIENT_ID: replace-with-google-oauth-client-id
  GOOGLE_CLIENT_SECRET: replace-with-google-oauth-client-secret
