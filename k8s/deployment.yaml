apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssl-certificate-monitor
  labels:
    app.kubernetes.io/name: ssl-certificate-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ssl-certificate-monitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ssl-certificate-monitor
    spec:
      containers:
        - name: api
          image: ssl-certificate-monitor
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: ssl-monitor-config
            - secretRef:
                name: ssl-monitor-secrets
                optional: true
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ssl-monitor-data
